name: Build and publish Docker Apple Machine

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - config/**
      - .github/workflows/publish.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push rootful image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: rootful
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:rootful
            ghcr.io/${{ github.repository }}:rootful-${{ github.run_number }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push rootless image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: rootless
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:rootless
            ghcr.io/${{ github.repository }}:rootless-${{ github.run_number }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
